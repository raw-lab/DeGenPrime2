[package]
name = "degenprime-rs"
version = "2.0.0"
edition = "2021"
authors = ["Richard Allen White III <rwhit101@uncc.edu>"]
description = "Robust PCR primer design and optimization for phylogenetically similar DNA sequences"
repository = "https://github.com/raw-lab/degenprime"
license = "MIT"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
polars = { version = "0.19", features = ["lazy", "csv", "parquet", "json"] }
plotly = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
ndarray = "0.15"
ndarray-stats = "0.5"

[[bin]]
name = "degenprime"
path = "src/main.rs"

[[bin]]
name = "degenprime-server"
path = "src/server.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

