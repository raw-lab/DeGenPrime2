[package]
name = "degenprime"
version = "2.1.0"
edition = "2021"
authors = ["Richard Allen White III <rwhit101@uncc.edu>"]
description = "Robust PCR primer design and optimization for phylogenetically similar DNA sequences"
repository = "https://github.com/raw-lab/degenprime"
license = "MIT"
readme = "README.md"

[dependencies]
clap = { version = "=4.4.18", features = ["derive"] }
clap_derive = "=4.4.7"
serde = { version = "=1.0.197", features = ["derive"] }
serde_json = "=1.0.114"

[dev-dependencies]
tempfile = "=3.8.1"

[lib]
name = "degenprime"
path = "src/lib.rs"

[[bin]]
name = "degenprime"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
